<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Who Wants To Be A Dungeon Crawler</title>
  <meta name="description" content="A pixel-art dungeon crawler in the browser. Short timed runs, one heart, and monsters that keep coming. Ten rooms down, a boss waits.">
  <meta name="theme-color" content="#181425">

  <!-- The icon in the browser tab, and on a phone's home screen -->
  <link rel="icon" type="image/png" href="assets/icons/favicon-64.png">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">

  <!-- The card shown when the link is shared (Discord, LinkedIn, WhatsApp...).
       The image needs a full URL, so it points at the live site. -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://dungeon-crawler.salihonder.dev/">
  <meta property="og:title" content="Who Wants To Be A Dungeon Crawler">
  <meta property="og:description" content="Short timed runs, one heart, and monsters that keep coming. Ten rooms down, a boss waits.">
  <meta property="og:image" content="https://dungeon-crawler.salihonder.dev/assets/social/preview.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="A room of the game: a knight mid-swing at a skeleton, with the run clock, the XP bar, gold and hearts at the edges. Next to it, the title: Who Wants To Be A Dungeon Crawler.">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="game">
    <!-- The stage: the strip, and Kaplay's canvas under it, scaled together
         as one picture (display.js), so they always keep their shape. -->
    <div id="stage">
      <!-- The strip: a hint or the button for what you're standing at on the
           left, depth and time (or the menu room's name) on the right -->
      <div id="strip">
        <button id="door-button" hidden></button>
        <p id="door-hint" hidden></p>
        <span id="progress"></span>
      </div>
      <!-- Kaplay adds its canvas here -->
    </div>
  </main>

  <!-- On a phone or tablet (no keyboard): the game needs one, so this says
       so over the game (main.js shows it). -->
  <div id="keyboard-notice" hidden>
    <p class="notice-title">This game needs a keyboard.</p>
    <p>Open it on a computer to play.</p>
  </div>

  <!-- Kaplay engine, pinned to an exact version so updates can't break the game -->
  <script src="https://cdn.jsdelivr.net/npm/kaplay@3001.0.19/dist/kaplay.js"></script>
  <!-- ZzFX 1.3.2 (MIT), the tiny sound effect generator; a copy lives in lib/ -->
  <script src="lib/zzfx.js"></script>
  <!-- type="module" lets our files use import/export -->
  <script type="module" src="src/main.js"></script>
</body>
</html>
