<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Who Wants To Be A Dungeon Crawler</title>
  <meta name="description" content="A pixel-art quiz dungeon crawler in the browser. Every room asks a question, and the doors are the answers. Pick the wrong one and cursed monsters crawl out of the floor.">
  <meta name="theme-color" content="#181425">

  <!-- The icon in the browser tab, and on a phone's home screen -->
  <link rel="icon" type="image/png" href="assets/icons/favicon-64.png">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">

  <!-- The card shown when the link is shared (Discord, LinkedIn, WhatsApp...).
       The image needs a full URL, so it points at the live site. -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://dungeon-crawler.salihonder.dev/">
  <meta property="og:title" content="Who Wants To Be A Dungeon Crawler">
  <meta property="og:description" content="Every room asks a question, and the doors are the answers. Pick the wrong one and cursed monsters crawl out of the floor.">
  <meta property="og:image" content="https://dungeon-crawler.salihonder.dev/assets/social/preview.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="A room of the game: a question on a scroll with one answer crossed out, chained doors, and a knight fighting red cursed monsters. Next to it, the title: Who Wants To Be A Dungeon Crawler.">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="game">
    <!-- The stage: the scroll, the strip under it, and Kaplay's canvas, scaled
         together as one picture (display.js), so they always keep their shape. -->
    <div id="stage">
      <!-- The question, on a scroll drawn in pixel art (scroll.js). The text is
           plain HTML on top of it, so it stays sharp and readable. The scroll
           only appears once it's been found; until then its space is empty. -->
      <div id="scroll" class="hidden">
        <div id="scroll-paper"></div>
        <div id="roll-left" class="roll"></div>
        <div id="roll-right" class="roll"></div>
        <div id="scroll-text" class="scroll-text">
          <p id="question" class="scroll-line">Loading the dungeon…</p>
          <ol id="answers" class="scroll-items"></ol>
        </div>
        <!-- Rooms without a scroll can write short notes in its space -->
        <div id="scroll-notes"></div>
      </div>
      <!-- The strip: a hint or the "Open door" button on the left, depth and
           time (or the menu room's name) on the right -->
      <div id="strip">
        <button id="door-button" hidden></button>
        <p id="door-hint" hidden></p>
        <span id="progress"></span>
      </div>
      <!-- Kaplay adds its canvas here -->
    </div>
  </main>

  <!-- Touch controls (src/touch.js): only shown on touch screens. Below the
       game when the phone is upright, over its edges when it's sideways. -->
  <div id="touch" aria-hidden="true">
    <button id="touch-fullscreen" hidden aria-label="Fullscreen">
      <!-- four corner brackets -->
      <svg viewBox="0 0 20 20" fill="none" stroke-width="2.5"><path d="M2 7V2h5M13 2h5v5M18 13v5h-5M7 18H2v-5"/></svg>
    </button>
    <div id="stick-zone">
      <div id="stick-base"><div id="stick-knob"></div></div>
    </div>
    <div id="touch-buttons">
      <button id="touch-use" class="touch-button" hidden></button>
      <div class="touch-row">
        <button id="touch-dash" class="touch-button round">DASH</button>
        <button id="touch-attack" class="touch-button round big">ATTACK</button>
      </div>
    </div>
  </div>

  <!-- Kaplay engine, pinned to an exact version so updates can't break the game -->
  <script src="https://cdn.jsdelivr.net/npm/kaplay@3001.0.19/dist/kaplay.js"></script>
  <!-- ZzFX 1.3.2 (MIT), the tiny sound effect generator; a copy lives in lib/ -->
  <script src="lib/zzfx.js"></script>
  <!-- type="module" lets our files use import/export -->
  <script type="module" src="src/main.js"></script>
</body>
</html>
