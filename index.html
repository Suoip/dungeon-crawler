<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Who Wants To Be A Dungeon Crawler</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- The question panel: plain HTML above the game, so text is readable on any screen -->
  <header id="panel" class="panel">
    <div class="panel-top">
      <span id="dungeon-title"></span>
      <span id="progress"></span>
    </div>
    <p id="question">Loading the dungeon…</p>
    <ol id="answers"></ol>
    <!-- Always the same height, whether it shows the button, the hint or nothing -->
    <div class="prompt-slot">
      <button id="door-button" hidden></button>
      <p id="door-hint" hidden></p>
    </div>
  </header>

  <!-- Kaplay draws the game in here. The overlay holds the game over / victory card. -->
  <main id="game">
    <div id="overlay" hidden></div>
  </main>

  <!-- Kaplay engine, pinned to an exact version so updates can't break the game -->
  <script src="https://cdn.jsdelivr.net/npm/kaplay@3001.0.19/dist/kaplay.js"></script>
  <!-- ZzFX 1.3.2 (MIT), the tiny sound effect generator; a copy lives in lib/ -->
  <script src="lib/zzfx.js"></script>
  <!-- type="module" lets our files use import/export -->
  <script type="module" src="src/main.js"></script>
</body>
</html>
